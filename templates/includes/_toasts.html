<div class="toast-container position-absolute p-3 top-0 start-50 translate-middle-x" style="z-index: 9999;">
  {% for message in messages %}
    <div class="toast align-items-center text-bg-{{message.tags}} border-0 mb-2"
     role="alert"
     aria-live="assertive"
     aria-atomic="true"
     data-bs-autohide="true"
     data-bs-delay="4000">
        <div class="d-flex">
          <div class="toast-body">
            {{message}}
          </div>
          <button type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close">
          </button>
        </div>
    </div>
  {% endfor %}
</div>
